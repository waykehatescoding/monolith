[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/installer", "xtask", "crates/theme"]

[workspace.package]
version = "0.0.6"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
zip = "2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
anyhow = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
once_cell = "1"
url = "2"
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced", "canvas"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18"
open = "5"
tray-icon = "0.26"
tauri-winrt-notification = "0.7"
winreg = "0.56"
mslnk = "0.1"
windows-sys = "0.61"
resvg = "0.50"
ico = "0.6"
embed-resource = "3"
toml = { version = "1", default-features = false, features = ["std", "parse"] }
saphyr-parser = "0.4"

[profile.release]
lto = "thin"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"
